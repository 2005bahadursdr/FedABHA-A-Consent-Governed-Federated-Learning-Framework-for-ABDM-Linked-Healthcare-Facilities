version: "1"

services:
  # FastAPI Backend Service
  - type: web
    name: fedabha-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MONGO_URI
        sync: false # Set this manually in the Render dashboard during deployment!

  # React Frontend Static Site
  - type: web
    name: fedabha-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        sync: false # Set this to your backend's URL (e.g., https://fedabha-backend-xxxx.onrender.com/api)
    routes:
      # Redirect all unknown routes to index.html for React Router client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
